server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 8m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/wasm;

    # El navegador no puede llamar a estos proveedores por CORS.
    location /llm-proxy/deepseek/ {
        proxy_pass https://api.deepseek.com/;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host api.deepseek.com;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Accept $http_accept;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /llm-proxy/hive/ {
        proxy_pass https://api.thehive.ai/;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host api.thehive.ai;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Accept $http_accept;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /llm-proxy/hive-cdn/ {
        proxy_pass https://api-cdn.thehive.ai/;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host api-cdn.thehive.ai;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Accept $http_accept;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /llm-proxy/openai/ {
        proxy_pass https://api.openai.com/;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host api.openai.com;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Accept $http_accept;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /llm-proxy/claude/ {
        proxy_pass https://api.anthropic.com/;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host api.anthropic.com;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header anthropic-version $http_anthropic_version;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Accept $http_accept;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /llm-proxy/hive-va1/ {
        proxy_pass https://api-va1.thehive.ai/;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host api-va1.thehive.ai;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Accept $http_accept;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Flutter reutiliza estos nombres en cada compilación. Si se cachean
    # como inmutables, Chrome sigue mostrando la versión anterior.
    location ~* ^/(index\.html|flutter_bootstrap\.js|flutter\.js|flutter_service_worker\.js|main\.dart\.js|version\.json|manifest\.json)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|wasm)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
